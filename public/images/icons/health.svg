<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Здоровье и поведение">
  <defs>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a5f2c"/>
      <stop offset="22%" stop-color="#e0b877"/>
      <stop offset="45%" stop-color="#fbeac4"/>
      <stop offset="70%" stop-color="#cf9f57"/>
      <stop offset="100%" stop-color="#7a521f"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5762f"/>
      <stop offset="40%" stop-color="#f5dda6"/>
      <stop offset="100%" stop-color="#8a5f22"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#7fc46b"/>
      <stop offset="45%" stop-color="#4e9c47"/>
      <stop offset="100%" stop-color="#28632d"/>
    </linearGradient>
    <radialGradient id="headG" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#8ed076"/>
      <stop offset="55%" stop-color="#4e9c47"/>
      <stop offset="100%" stop-color="#255c2a"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.8" dy="1.4" stdDeviation="1.1" flood-color="#243d18" flood-opacity=".45"/>
    </filter>
  </defs>

  <ellipse cx="32" cy="58" rx="13" ry="2.8" fill="#4a3a1a" opacity=".28" filter="url(#soft)"/>

  <!-- тело змеи целиком: витки, уходящие за посох -->
  <g fill="none" stroke-linecap="round" filter="url(#lift)">
    <path d="M24 51 C34 55 44 50 43 43 C42 36 22 38 21 31 C20 24 40 26 42 19 C43 14.5 38.5 11.5 35 10.5"
          stroke="url(#skin)" stroke-width="6"/>
  </g>

  <!-- посох -->
  <rect x="29.6" y="7" width="4.8" height="48" rx="2.4" fill="url(#rod)"/>
  <rect x="27.4" y="5.2" width="9.2" height="3.6" rx="1.8" fill="url(#cap)"/>
  <rect x="30.9" y="8" width="1.1" height="46" rx=".55" fill="#fff" opacity=".45"/>

  <!-- витки, проходящие ПЕРЕД посохом -->
  <g fill="none" stroke-linecap="round">
    <path d="M24 51 C34 55 44 50 43 43" stroke="url(#skin)" stroke-width="6"/>
    <path d="M21 31 C20 24 40 26 42 19" stroke="url(#skin)" stroke-width="6"/>
    <path d="M25.5 50.4 C33.5 53.4 41.6 49.4 41.4 43.6" stroke="#a8dd8e" stroke-width="1.5" opacity=".6"/>
    <path d="M22.6 30.7 C22 24.8 38.6 26.4 40.5 19.8" stroke="#a8dd8e" stroke-width="1.5" opacity=".6"/>
  </g>

  <!-- голова -->
  <g filter="url(#lift)">
    <ellipse cx="33" cy="9.5" rx="6.2" ry="4.6" transform="rotate(-24 33 9.5)" fill="url(#headG)"/>
    <ellipse cx="31.2" cy="7.8" rx="2.4" ry="1.4" transform="rotate(-24 31.2 7.8)" fill="#b6e7a0" opacity=".55"/>
    <circle cx="30.4" cy="9" r="1.15" fill="#1e2a14"/>
    <circle cx="30.05" cy="8.65" r=".4" fill="#fff" opacity=".9"/>
    <path d="M27.6 11.4 L23.4 12.6 M25.6 12.1 L23.6 14" stroke="#c0392b" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
