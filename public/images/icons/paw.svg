<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Лапка">
  <defs>
    <radialGradient id="padG" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f2a882"/>
      <stop offset="45%" stop-color="#dd6f3e"/>
      <stop offset="100%" stop-color="#9a3f16"/>
    </radialGradient>
    <radialGradient id="toeG" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f7bb99"/>
      <stop offset="48%" stop-color="#e07b48"/>
      <stop offset="100%" stop-color="#a54a1c"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#6d2c08" flood-opacity=".42"/>
    </filter>
  </defs>

  <ellipse cx="32" cy="57.5" rx="15" ry="2.8" fill="#6d2c08" opacity=".24" filter="url(#soft)"/>

  <g filter="url(#lift)">
    <ellipse cx="32" cy="42" rx="14" ry="12" fill="url(#padG)"/>
    <ellipse cx="26.5" cy="36" rx="5.5" ry="3.6" fill="#fff" opacity=".28"/>

    <ellipse cx="14.5" cy="26" rx="6.2" ry="7.4" transform="rotate(-20 14.5 26)" fill="url(#toeG)"/>
    <ellipse cx="25" cy="16.5" rx="6" ry="7.6" transform="rotate(-8 25 16.5)" fill="url(#toeG)"/>
    <ellipse cx="39" cy="16.5" rx="6" ry="7.6" transform="rotate(8 39 16.5)" fill="url(#toeG)"/>
    <ellipse cx="49.5" cy="26" rx="6.2" ry="7.4" transform="rotate(20 49.5 26)" fill="url(#toeG)"/>

    <ellipse cx="13" cy="23" rx="2.2" ry="2.8" transform="rotate(-20 13 23)" fill="#fff" opacity=".33"/>
    <ellipse cx="23.6" cy="13.4" rx="2.2" ry="2.9" fill="#fff" opacity=".33"/>
    <ellipse cx="37.6" cy="13.4" rx="2.2" ry="2.9" fill="#fff" opacity=".33"/>
    <ellipse cx="48" cy="23" rx="2.2" ry="2.8" transform="rotate(20 48 23)" fill="#fff" opacity=".33"/>
  </g>
