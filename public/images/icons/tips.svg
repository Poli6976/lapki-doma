<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Советы">
  <defs>
    <radialGradient id="glass" cx="36%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="45%" stop-color="#ffd985"/>
      <stop offset="100%" stop-color="#e0972f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd06b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffd06b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e766c"/>
      <stop offset="25%" stop-color="#d9d2c6"/>
      <stop offset="55%" stop-color="#f2eee6"/>
      <stop offset="80%" stop-color="#a9a196"/>
      <stop offset="100%" stop-color="#6d665c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#7a4c12" flood-opacity=".4"/>
    </filter>
  </defs>

  <ellipse cx="32" cy="58.5" rx="12" ry="2.6" fill="#7a4c12" opacity=".25" filter="url(#soft)"/>
  <circle cx="32" cy="26" r="24" fill="url(#halo)"/>

  <g filter="url(#lift)">
    <path d="M32 5 C21.5 5 13.5 13 13.5 23.2 c0 6.6 3.4 10.6 6.4 14.1 c2.1 2.4 3.4 4.2 3.9 6.7 h16.4
             c.5-2.5 1.8-4.3 3.9-6.7 c3-3.5 6.4-7.5 6.4-14.1 C50.5 13 42.5 5 32 5 Z"
          fill="url(#glass)"/>
    <path d="M24.5 12.5 c-3.4 2.6-5.4 6.4-5.6 10.8 c-.1 1.9 2.9 2.1 3.2.2 c.4-3.4 1.9-6.2 4.5-8.3 c1.5-1.2-.5-3.9-2.1-2.7 Z"
          fill="#fffdf2" opacity=".72"/>
  </g>

  <!-- нить накала -->
  <path d="M27 34 q2.5-7 5-3.5 q2.5 3.5 5-3.5" fill="none" stroke="#a85f12" stroke-width="1.6"
        stroke-linecap="round" opacity=".8"/>
  <path d="M27 34 q2.5-7 5-3.5 q2.5 3.5 5-3.5" fill="none" stroke="#fff3c4" stroke-width=".7"
        stroke-linecap="round"/>

  <!-- цоколь -->
  <g>
    <rect x="23.2" y="45" width="17.6" height="4.2" rx="1.6" fill="url(#metal)"/>
    <rect x="23.8" y="49.8" width="16.4" height="3.9" rx="1.5" fill="url(#metal)"/>
    <path d="M25.6 54.3 h12.8 c-.8 3.2-2.9 4.7-6.4 4.7 s-5.6-1.5-6.4-4.7 Z" fill="#8d857a"/>
    <rect x="26.5" y="45.6" width="1.5" height="8.2" fill="#fff" opacity=".38"/>
  </g>
</svg>
